[package]
name = "fonoteca-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "fonoteca-client"

[dependencies]
image = { version = "0.25", default-features = false, features = ["webp"] }
listenbrainz = { path = "../listenbrainz" }
opensubsonic = { path = "../opensubsonic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
keyring-core = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.18"
