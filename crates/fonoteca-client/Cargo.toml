[package]
name = "fonoteca-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "fonoteca-client"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
listenbrainz = { path = "../listenbrainz" }
opensubsonic = { path = "../opensubsonic" }
playback = { path = "../playback" }
radiobrowser = { path = "../radiobrowser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
network-output = { path = "../network-output" }
flate2 = "1.1"
keyring-core = "1"
radiostream = { path = "../radiostream" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
# Adds fonts to the ones Slint falls back on, for the scripts Inter lacks.
slint = { version = "1.18", features = ["unstable-fontique-011"] }
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDictionary", "NSObject", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
slint = { version = "1.18", features = ["backend-android-activity-06"] }

[dev-dependencies]
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.18"
