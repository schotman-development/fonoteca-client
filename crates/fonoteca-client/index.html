<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fonoteca</title>
    <link data-trunk rel="rust" data-bin="fonoteca-client">
    <link data-trunk rel="copy-dir" href="icons">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="icons/manifest.webmanifest">
    <style>
      /* Slint gives the canvas an inline size from the window's preferred
         size; !important lets the browser window decide instead. */
      html, body { margin: 0; height: 100%; }
      canvas { display: block; outline: none; width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
</html>
