[workspace]
resolver = "3"
members = ["crates/*"]

# Dependencies are optimized in dev builds too. The browser preview runs the
# dev build, and an unoptimized Slint renderer and image decoder make loading
# covers and scrolling stutter. Only the first build takes longer.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Line tables keep file:line in backtraces. Full debug info was 90% of each
# debug binary and got rewritten on every link. For a debugger, build with
# `--profile debugging`.
[profile.dev]
debug = "line-tables-only"

[profile.debugging]
inherits = "dev"
debug = true

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/schotman-development/fonoteca-client"
