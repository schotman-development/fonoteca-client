# Builds the Android, macOS and Linux apps on every push to main and puts them
# in the one `edge` pre-release, replacing the build before. The version stays
# as it is in Cargo.toml; each build is called <version>-dev.<run number>,
# which is also the release's title, for Obtainium's "Use release title as
# version string". A macOS or Linux build that fails leaves the Android one
# published.
name: Rolling release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # The runner's own ANDROID_NDK_HOME is another NDK.
      - name: Install the NDK and the platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: scripts/ffmpeg.sh android

      # skia-bindings fetches its prebuilt Skia with plain curl, which GitHub
      # times out for unauthenticated release downloads under load, and the
      # build from source it then falls back to can't find the NDK's clang++.
      # So fetch them through gh, signed in: every Android variant of this
      # version, since the key in the file name depends on the features
      # Slint asks for.
      - name: Fetch the prebuilt Skia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^name = "skia-bindings"$/{n;s/^version = "\(.*\)"/\1/p}' Cargo.lock)
          gh release download "$version" --repo rust-skia/skia-binaries \
            --pattern 'skia-binaries-*-aarch64-linux-android-*.tar.gz' --dir "$RUNNER_TEMP/skia"
          echo "SKIA_BINARIES_URL=file://$RUNNER_TEMP/skia/skia-binaries-{key}.tar.gz" >> "$GITHUB_ENV"

      # Linked for Android 9 (API 28), the app's oldest. Not with cargo-ndk:
      # it tells Slint's build script to compile its Java helper against
      # that platform too, which lacks the classes the helper uses. The
      # helper gets the platform the app is compiled against. bindgen reads
      # FFmpeg's headers against the NDK's C library rather than the
      # runner's, with the API level in its target, which the NDK's headers
      # insist on.
      - name: Build the Rust library
        env:
          ANDROID_PLATFORM: 36
        run: |
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tools/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$tools/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$tools/llvm-ar"
          export FFMPEG_DIR="$PWD/target/android-ffmpeg/prefix"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android28 --sysroot=$tools/../sysroot"
          rustup target add aarch64-linux-android
          cargo rustc --locked -p fonoteca-client --lib --release --target aarch64-linux-android --crate-type cdylib
          mkdir -p android/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libfonoteca_client.so android/src/main/jniLibs/arm64-v8a/

      - name: Build the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: fonoteca
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE" | base64 -d > "$SIGNING_STORE_FILE"
          cd android
          ./gradlew --no-daemon assembleRelease -PappVersion="$APP_VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: android/build/outputs/apk/release/fonoteca-release.apk
          retention-days: 1

  macos:
    uses: ./.github/workflows/macos-dev.yml
    secrets: inherit

  # In Debian 12, whose glibc 2.36 the AppImage then needs at least.
  linux:
    runs-on: ubuntu-24.04
    container: docker.io/library/rust:slim-bookworm@sha256:392f221964669402bf4ae133d2a46c3ae270f64734133f4b2703d40019235c1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build the AppImage
        run: scripts/appimage.sh "$APP_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fonoteca-${{ env.APP_VERSION }}-linux-x86_64
          path: target/Fonoteca-${{ env.APP_VERSION }}-linux-x86_64.AppImage
          retention-days: 1

  # The binary is built in Debian 12 as for the AppImage, and packed in a
  # privileged container, where flatpak-builder can start its sandbox.
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build the app
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            docker.io/library/rust:slim-bookworm@sha256:392f221964669402bf4ae133d2a46c3ae270f64734133f4b2703d40019235c1a \
            scripts/flatpak-stage.sh

      - name: Build the Flatpak
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work docker.io/library/ubuntu:24.04 sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends flatpak flatpak-builder appstream ca-certificates >/dev/null
            scripts/flatpak.sh "$1"' sh "$APP_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fonoteca-${{ env.APP_VERSION }}-linux-x86_64-flatpak
          path: target/Fonoteca-${{ env.APP_VERSION }}-linux-x86_64.flatpak
          retention-days: 1

  publish:
    needs: [android, macos, linux, flatpak]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: builds

      - name: Replace the edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="fonoteca-$APP_VERSION.apk"
          mv builds/android-apk/fonoteca-release.apk "$apk"
          shopt -s nullglob
          macos=(builds/Fonoteca-*-macos-arm64/*.zip)
          linux=(builds/Fonoteca-*-linux-x86_64/*.AppImage builds/Fonoteca-*-linux-x86_64-flatpak/*.flatpak)
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge "$apk" "${macos[@]}" "${linux[@]}" --prerelease --target "$GITHUB_SHA" --title "$APP_VERSION" \
            --notes "A development build of $GITHUB_SHA, replaced on every push to main. Not a release."
