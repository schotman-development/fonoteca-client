name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Search the [open issues](https://github.com/schotman-development/fonoteca-client/issues) first, in case it is known.
        Never paste a password, API key, token or a URL that holds one. For a security problem, see [SECURITY.md](https://github.com/schotman-development/fonoteca-client/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open an album
        2. Right-click a track
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux
        - macOS
        - Browser preview
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The edge build's name, such as 0.0.0-dev.4, or the commit you built.
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server and version
      placeholder: Navidrome 0.58.0
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, logs, the device or the desktop environment.
